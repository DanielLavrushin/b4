{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}} - b4 hub</title>
<style>
:root {
  color-scheme: dark;
  --bg: #1a0e15; --paper: #1f1218; --dark: #0f0a0e;
  --text: #ffe8f4; --muted: #f8d7e9; --dim: rgba(248, 215, 233, 0.62);
  --primary: #9E1C60; --primary-light: #C9539A; --accent: #F5AD18;
  --line: rgba(245, 173, 24, 0.24); --line-light: rgba(245, 173, 24, 0.12);
  --soft: rgba(158, 28, 96, 0.14);
  --ok: #66bb6a; --warn: #ffa726; --err: #f44336;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-wrap: anywhere; }
header { background: linear-gradient(90deg, #561530 0%, #811844 35%, #9E1C60 70%, #F5AD18 100%); }
header .bar, main, footer { max-width: 60rem; margin: 0 auto; padding-inline: 1rem; }
header .bar { display: flex; flex-wrap: wrap; gap: 1rem; align-items: baseline; padding-block: .8rem; }
header .brand { font-weight: 800; letter-spacing: .04em; text-decoration: none; color: #fff; }
header nav a { color: #fff; margin-right: .9rem; text-decoration: none; opacity: .9; }
header nav a:hover { opacity: 1; text-decoration: underline; }
main { padding-block: 1rem 2rem; }
footer { padding-block: 1rem; border-top: 1px solid var(--line-light); color: var(--dim); font-size: .85rem; }
a { color: var(--accent); }
h1 { font-size: 1.35rem; margin: 1.25rem 0 .75rem; color: var(--text); }
h2 { font-size: 1.05rem; margin: 1.25rem 0 .5rem; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
h3 { font-size: 1rem; margin: .75rem 0 .25rem; }
p { margin: .35rem 0; }
.muted { color: var(--dim); }
.notice { padding: .6rem .8rem; border: 1px solid var(--line); border-radius: .4rem; background: var(--soft); }
button, input[type=submit] { font: inherit; padding: .4rem .8rem; border: 1px solid var(--line); border-radius: .35rem; background: var(--soft); color: var(--text); cursor: pointer; }
button:hover, input[type=submit]:hover { background: var(--primary); border-color: var(--primary-light); }
form.inline { display: inline-flex; gap: .4rem; align-items: center; margin: .25rem .5rem .25rem 0; flex-wrap: wrap; }
form.inline input { font: inherit; padding: .4rem .55rem; border: 1px solid var(--line); border-radius: .35rem; background: var(--dark); color: var(--text); max-width: 100%; }
form.inline input:focus { outline: none; border-color: var(--accent); }
ul.cards { list-style: none; margin: 0; padding: 0; }
li.card, article.entry, details.row { border: 1px solid var(--line-light); border-radius: .5rem; padding: .75rem 1rem; margin-block: .75rem; background: var(--paper); }
li.card h2 { margin: 0 0 .25rem; }
details.row summary { cursor: pointer; }
details.row[open] { border-color: var(--line); }
.targets { font-weight: 500; }
.strategy, .rating { font-size: .95rem; }
.meta { color: var(--dim); font-size: .9rem; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: .25rem .75rem; margin: .5rem 0; }
dl.facts dt { color: var(--dim); }
dl.facts dd { margin: 0; }
ul.plain { margin: 0; padding-left: 1.1rem; }
pre.json { border: 1px solid var(--line-light); border-radius: .4rem; padding: .75rem; overflow-x: auto; font-size: .85rem; white-space: pre; background: var(--dark); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85rem; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th { color: var(--dim); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: .75rem; }
th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--line-light); vertical-align: top; }
@media (max-width: 40rem) { dl.facts { grid-template-columns: 1fr; } dl.facts dt { margin-top: .4rem; } }
</style>
</head>
<body>
<header><div class="bar">
<a class="brand" href="/admin">B4 HUB</a>
<nav><a href="/admin">Queue</a><a href="/admin/keys">Keys</a></nav>
</div></header>
<main>
{{template "content" .}}
</main>
<footer>Sets shared by b4 users. A rating is the sum of their reports on their own networks, nothing more.</footer>
</body>
</html>{{end}}
